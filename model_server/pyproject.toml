[project]
name = "coderag-model-server"
version = "0.1.0"
description = "CodeRAG 本地模型服务：CodeBERT 代码嵌入（GPU 优先 CPU 回退）/ 后续 bge-reranker"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "transformers>=4.40",           # CodeBERT 加载（AutoTokenizer + AutoModel）
  "torch>=2.2",                   # CodeBERT 推理；CUDA 版经下方 pytorch-cu128 源安装（本机 RTX 4050/CUDA12.8）
  "sentence-transformers>=3.0",   # 备用（其它 SBERT 模型）
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

# CUDA 版 torch（本机 RTX 4050 / driver 572.83 / CUDA 12.8）。
# explicit=true → 仅 torch 走此源，其余包仍走上面的清华 PyPI；cu128 wheel 自带 CUDA 运行库（~2.5GB）。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
