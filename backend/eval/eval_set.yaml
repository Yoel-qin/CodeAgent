  - { id: c02, text: "版本号 getVersion", relevant: ["Account.getVersion", "Profile.getVersion"] }
  - { id: c03, text: "Account 这个账户类整体", relevant: ["Account"] }
  - { id: c04, text: "Profile 这个档案类整体", relevant: ["Profile"] }

  # ---- 调用链（graph 子集，tags: [call_chain]）----
  # sample repo 仅 3 条 call_graph 边、且 callee 多为向量可直接命中的方法 → 图遍历增益预计≈0；
  # 此组用于演示 --graph-subset 子集跑通，并如实暴露「需更丰富调用链 repo 才能量化 §4 +20%」。
  - { id: cc01, text: "Account 取款 withdraw 时会触发什么通知", relevant: ["Account.notifyOverdraft"], tags: ["call_chain"] }
