# 检索评测集（横切·评测 / 后端设计 Phase 9.2）。
#
# 标注 query → 相关 chunk。relevant 用三种**人工可读**标注（eval_service.resolve_relevant 运行时
# 解析为 chunk_id，对内容变更鲁棒——chunk_id 内嵌 sha256(content)[:8] 会随内容变）：
#   - 含 "." → code_anchor_key "Class.method"（见 pipeline/metadata.make_anchor_key）
#   - 以 "code_"/"doc_" 开头 → literal chunk_id
#   - 否则 → class_name（整文件/类级 chunk，如 "Foo"；其 code_anchor_key 为 None）
#
# target_repos: 评测前须先入库（data/* 被 gitignore，故评测集与入库数据须本机一致）：
#   uv run python scripts/ingest_code.py --repo ../data/repo/gitdemo --module demo   # Account / Profile（方法级 chunk）
#   uv run python scripts/ingest_code.py --repo ../data/repo/sample  --module demo   # Foo（整文件 chunk）
#
# 校验命中率:  uv run python scripts/eval_retrieval.py --validate
# 跑评测:      uv run python scripts/eval_retrieval.py --top-k 10
#
# ~85 对（M27 扩容自 seed 36）：单方法直查 + paraphrase NL 鲁棒性（同 ground-truth 多种自然语言表述）
# + 多方法/概念聚合 + 整类/跨类 + 调用链 smoke。样本仓库仅 3 类 ~40 方法锚点，诚实上限靠 paraphrase
# + 多相关扩到 ~85（非强凑 100）。改后务必跑 --validate 确认近 100% 解析（unresolved 会静默抬高表观质量）。
version: 1
target_repos:
  - { repo: "../data/repo/gitdemo", module: demo, note: "Account / Profile 方法级 chunk" }
  - { repo: "../data/repo/sample", module: demo, note: "Foo 整文件 chunk" }

queries:
  # ---- Account：单方法直查 ----
  - { id: a01, text: "Account 账户存款 deposit 方法是怎么实现的", relevant: ["Account.deposit"] }
  - { id: a02, text: "账户取款 withdraw 的逻辑", relevant: ["Account.withdraw"] }
  - { id: a03, text: "怎么获取账户余额 getBalance", relevant: ["Account.getBalance"] }
  - { id: a04, text: "判断账户能否进行交易 canTransact", relevant: ["Account.canTransact"] }
  - { id: a05, text: "账户扣除手续费 applyFee", relevant: ["Account.applyFee"] }
  - { id: a06, text: "查询累计的手续费 getFeeAccumulated", relevant: ["Account.getFeeAccumulated"] }
  - { id: a07, text: "账户审计日志 audit", relevant: ["Account.audit"] }
  - { id: a08, text: "账户快照 snapshot", relevant: ["Account.snapshot"] }
  - { id: a09, text: "账户是否处于激活状态 isActive", relevant: ["Account.isActive"] }
  - { id: a10, text: "停用账户 deactivate", relevant: ["Account.deactivate"] }
  - { id: a11, text: "金额是否在限额之内 withinLimit", relevant: ["Account.withinLimit"] }
  - { id: a12, text: "透支时的通知 notifyOverdraft", relevant: ["Account.notifyOverdraft"] }
  - { id: a13, text: "重置账户状态 reset", relevant: ["Account.reset"] }
  - { id: a14, text: "查询账户标识 getAccountId", relevant: ["Account.getAccountId"] }
  - { id: a15, text: "账户版本号 getVersion 并发控制", relevant: ["Account.getVersion"] }

  # ---- Profile：单方法直查 ----
  - { id: p01, text: "Profile 修改名字 setName", relevant: ["Profile.setName"] }
  - { id: p02, text: "设置邮箱地址 setEmail", relevant: ["Profile.setEmail"] }
  - { id: p03, text: "邮箱格式是否合法 hasValidEmail", relevant: ["Profile.hasValidEmail"] }
  - { id: p04, text: "个人信息脱敏 masked", relevant: ["Profile.masked"] }
  - { id: p05, text: "Profile 的摘要信息 summary", relevant: ["Profile.summary"] }
  - { id: p06, text: "资料是否填写完整 isComplete", relevant: ["Profile.isComplete"] }
  - { id: p07, text: "格式化显示名称 formatName", relevant: ["Profile.formatName"] }
  - { id: p08, text: "第一个无效字段 firstInvalidField", relevant: ["Profile.firstInvalidField"] }
  - { id: p09, text: "调试字符串输出 toDebugString", relevant: ["Profile.toDebugString"] }
  - { id: p10, text: "是否可以展示 isDisplayable", relevant: ["Profile.isDisplayable"] }
  - { id: p11, text: "获取更新次数 getUpdates", relevant: ["Profile.getUpdates"] }
  - { id: p12, text: "查询档案邮箱 getEmail", relevant: ["Profile.getEmail"] }
  - { id: p13, text: "档案标识 getProfileId", relevant: ["Profile.getProfileId"] }
