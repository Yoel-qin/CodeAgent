# 链路模板：RocketMQ 消息发送/消费的完整方法序列（trace Agent 套模板产链路）。
# 方法名基于 RocketMQ 4.x 公开源码；Agent 实际运行时用 search_code/get_call_chain 核实当前代码。
# 内容待领域专家校验。
- name: normal_message_send
  scenario: 普通消息发送（最常见链路）
  method_sequence:
    - DefaultMQProducer.send
    - DefaultMQProducerImpl.sendDefaultImpl
    - DefaultMQProducerImpl.tryToCompressMessage
    - MQClientInstance.selectMessageQueue
    - DefaultMQProducerImpl.sendKernelImpl
    - MQClientAPIImpl.sendMessage
    - SendMessageProcessor.send
    - MessageStore.putMessage
    - CommitLog.putMessage
  notes: 生产者 send → 选 queue（默认轮询 + 故障隔离）→ RPC → broker 存 CommitLog → 异步建 ConsumeQueue/Index。失败重试 retryTimesWhenSendFailed。

- name: transaction_message
  scenario: 事务消息（半消息 + 本地事务 + commit/rollback）
  method_sequence:
    - TransactionMQProducer.sendMessageInTransaction
    - TransactionMQProducerImpl.sendMessageInTransaction
    - DefaultMQProducerImpl.send
    - SendMessageProcessor.send
    - TransactionListener.executeLocalTransaction
    - EndTransactionProcessor.process
    - TransactionListener.checkLocalTransaction
  notes: half message 对 producer 不可见；commit 后才投递到真实 topic。回查最多 15 次。关键类 EndTransactionProcessor + TransactionalMessageService。

- name: delay_message
  scenario: 定时/延迟消息（setDelayTimeLevel）
  method_sequence:
    - DefaultMQProducer.send
    - SendMessageProcessor.send
    - ScheduleMessageService.buildRunningStat
    - ScheduleMessageService.DeliverDelayedMessageTimerTask
    - MessageStore.putMessage
  notes: 18 个固定延迟级别（1s/5s/10s/30s/1m/2m...2h）。delay 消息先存 SCHEDULE_TOPIC_XXXX，到时重写真实 topic 投递。关键类 ScheduleMessageService。

- name: orderly_message
  scenario: 顺序消息（分区内严格有序）
  method_sequence:
    - DefaultMQProducer.sendOrderly
    - MessageQueueSelector.select
    - DefaultMQProducerImpl.sendKernelImpl
    - SendMessageProcessor.send
    - ConsumeMessageOrderlyService
    - ProcessQueue.ConsumeRequest
  notes: 顺序性靠"同 shardingKey 同 queue + 串行消费"。消费端 ConsumeMessageOrderlyService（vs 并发 ConsumeMessageConcurrentlyService）。代价：吞吐降 + 消费失败阻塞。
