[project]
name = "coderag-backend"
version = "0.1.0"
description = "CodeRAG backend — FastAPI + LangGraph RAG pipeline"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",      # alembic 同步迁移用
    "alembic>=1.13",
    # 缓存/队列
    "redis>=5.0",
    # 日志 / HTTP / 认证
    "loguru>=0.7",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # ---- Agent 编排（Phase 7）----
    # langgraph 提供 StateGraph / get_stream_writer / MemorySaver / create_react_agent；
    # langchain-core 提供 reducer/类型；langchain-openai 提供工具调用 + with_structured_output（场景 Agent）。
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    # langchain-mcp-adapters：让场景 Agent 调用远程/在线 MCP server（WEB_SEARCH Agent）。
    "langchain-mcp-adapters>=0.1",
    # ---- 以下依赖随阶段递增 ----
    # Phase 1.5: PyMuPDF, pdfplumber, python-docx, mammoth, paddleocr
    # Phase 2/5: sentence-transformers, torch, dgl (model_server)
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "jieba>=0.42.1",
    "elasticsearch>=8.11,<9",
    "pymilvus>=3.0.0",
    # Phase 1.5a: 文本型 PDF / Word(.docx) / txt 解析（pymupdf 导入名 fitz）
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "minio>=7.2.20",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "rapidocr-onnxruntime>=1.4.4",
    "langgraph-checkpoint-postgres>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# 只从 tests/ 收集——app/ 下有以 test_ 开头的业务模块（如 agents/test_generation.py，
# 「测试生成 Agent」的节点函数名 test_generation 也以 test_ 开头），不限定会被 pytest
# 误当测试收集（fixture 'state' not found）。
testpaths = ["tests"]
