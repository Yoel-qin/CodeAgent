# 检索评测集（横切·评测 / 后端设计 Phase 9.2）。
#
# 标注 query → 相关 chunk。relevant 用三种**人工可读**标注（eval_service.resolve_relevant 运行时
# 解析为 chunk_id，对内容变更鲁棒——chunk_id 内嵌 sha256(content)[:8] 会随内容变）：
#   - 含 "." → code_anchor_key "Class.method"（见 pipeline/metadata.make_anchor_key）
#   - 以 "code_"/"doc_" 开头 → literal chunk_id
#   - 否则 → class_name（整文件/类级 chunk，如 "Foo"；其 code_anchor_key 为 None）
#
# target_repos: 评测前须先入库（data/* 被 gitignore，故评测集与入库数据须本机一致）：
#   uv run python scripts/ingest_code.py --repo ../data/repo/gitdemo --module demo   # Account / Profile（方法级 chunk）
#   uv run python scripts/ingest_code.py --repo ../data/repo/sample  --module demo   # Foo（整文件 chunk）
#
# 校验命中率:  uv run python scripts/eval_retrieval.py --validate
# 跑评测:      uv run python scripts/eval_retrieval.py --top-k 10
#
# ~85 对（M27 扩容自 seed 36）：单方法直查 + paraphrase NL 鲁棒性（同 ground-truth 多种自然语言表述）
# + 多方法/概念聚合 + 整类/跨类 + 调用链 smoke。样本仓库仅 3 类 ~40 方法锚点，诚实上限靠 paraphrase
# + 多相关扩到 ~85（非强凑 100）。改后务必跑 --validate 确认近 100% 解析（unresolved 会静默抬高表观质量）。
version: 1
target_repos:
  - { repo: "../data/repo/gitdemo", module: demo, note: "Account / Profile 方法级 chunk" }
  - { repo: "../data/repo/sample", module: demo, note: "Foo 整文件 chunk" }
  - { repo: "../data/repo/rocketmq", module: rocketmq, note: "M46 全量 1059 文件；rm* 子集锚点库（M31）" }
  - { repo: "../data/repo/sa-token", module: satoken, note: "M47 中文注释真实库（六臂矩阵）" }

