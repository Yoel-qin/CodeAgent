version: 1
target_repos:
  - {repo: "../data/repo/sample", module: demo, note: "sample Java repo for QA eval"}
# scoring_hints 是给 LLMJudge 的评分锚点（非 chunk_id）：should_mention 期望要点，should_not_hallucinate 不应捏造
queries:
  - id: q01
    text: "Account 存款 deposit 方法的实现逻辑是什么？"
    scoring_hints: {should_mention: ["余额增加", "记录交易"], should_not_hallucinate: []}
  - id: q02
    text: "Account 取款 withdraw 时会做什么校验？"
    scoring_hints: {should_mention: ["余额校验", "透支处理"], should_not_hallucinate: []}
  - id: q03
    text: "Profile 的 formatName 方法如何处理空名？"
    scoring_hints: {should_mention: ["空名兜底"], should_not_hallucinate: []}
  - id: q04
    text: "Foo 类的 checkLocalTransaction 做什么？"
    scoring_hints: {should_mention: ["本地事务检查"], should_not_hallucinate: []}
  - id: q05
    text: "Account.notifyOverdraft 在什么条件下触发？"
    scoring_hints: {should_mention: ["余额为负", "透支通知"], should_not_hallucinate: []}
  - id: q06
    text: "Foo 的主要方法有哪些？"
    scoring_hints: {should_mention: ["方法列表"], should_not_hallucinate: ["虚构方法名"]}
  - id: q07
    text: "Account 与 Profile 之间有什么关联？"
    scoring_hints: {should_mention: ["关联关系"], should_not_hallucinate: []}
  - id: q08
    text: "本系统有没有处理并发的代码？请说明。"
    scoring_hints: {should_mention: [], should_not_hallucinate: ["编造并发机制"]}
