[project]
name = "coderag-backend-v2"
version = "0.1.0"
description = "CodeRAG v2 — Agentic + MCP 架构（方案二：代码工具精确检索 + 文档向量库）"
requires-python = ">=3.11"

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",      # alembic 同步迁移用
    "alembic>=1.13",
    # 基础设施 client（health 探活即需）
    "redis>=5.0",
    "pymilvus>=3.0.0",
    "elasticsearch>=8.11,<9",    # 9.x 与 ES 8.11 服务端不兼容，勿升
    # 日志 / HTTP
    "loguru>=0.7",
    "httpx>=0.27",
    # MCP server
    "mcp[cli]>=1.29,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=12.3.0",
    "minio>=7.2.20",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
