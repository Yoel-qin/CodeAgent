  # ---- Foo：整文件 chunk（38 行 < 200，无方法级 chunk，故 relevant 取整文件 chunk "Foo"）----
  - { id: f01, text: "RocketMQ 本地事务回查 checkLocalTransaction", relevant: ["Foo"] }
  - { id: f02, text: "Foo 的 run 方法入口", relevant: ["Foo"] }
  - { id: f03, text: "发送事务回查消息 sendCheckMessage", relevant: ["Foo"] }
  - { id: f04, text: "Foo 事务消息处理器这个类", relevant: ["Foo"] }
  - { id: f05, text: "事务消息回查处理器", relevant: ["Foo"] }
  - { id: f06, text: "本地事务状态检查", relevant: ["Foo"] }
  - { id: f07, text: "RocketMQ 半消息处理", relevant: ["Foo"] }

  # ---- Account paraphrase：NL 鲁棒性（不点方法名，同 ground-truth 多种自然表述）----
  - { id: pa01, text: "往账户里存钱", relevant: ["Account.deposit"] }
  - { id: pa02, text: "把钱打进账户增加余额", relevant: ["Account.deposit"] }
