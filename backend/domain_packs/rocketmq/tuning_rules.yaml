# 调优规则：场景 → 参数 → 建议 → 权衡（tune Agent 按场景套规则给配置建议）。
# 内容基于 RocketMQ 4.x 公开源码与文档，待领域专家校验。code_ref 留空（源码未入库）。
- scenario: high_throughput
  parameter: pullBatchSize / consumeThreadMin / producer async+batch
  suggestion: 提高 pullBatchSize（默认 32→100）、consumeThreadMin（默认 20→64），producer 改异步发送 + 批量
  tradeoff: 增大 CPU/内存开销；批量与异步降低单条延迟确定性
  code_ref: ""
- scenario: low_latency
  parameter: sendMsgTimeout / consumeTimeout / maxReconsumeTimes
  suggestion: 适当 sendMsgTimeout（默认 3s）、consumeTimeout 收紧、maxReconsumeTimes 低（1-2）避免重试堆积
  tradeoff: 重试少降低可靠性；超时短可能误失败
  code_ref: ""
- scenario: orderly_consume
  parameter: MessageQueueSelector / ConsumeMessageOrderlyService / maxReconsumeTimes
  suggestion: 用 MessageQueueSelector 按 shardingKey 选 queue；顺序消费；maxReconsumeTimes 高（保序完整）
  tradeoff: 吞吐显著降低；消费失败阻塞整 queue
  code_ref: ""
- scenario: reliable_delivery
  parameter: flushDiskType / brokerRole
  suggestion: flushDiskType=SYNC_FLUSH + brokerRole=SYNC_MASTER（同步刷盘 + 同步双写）
  tradeoff: 吞吐降 30-50%；延迟增加
  code_ref: ""
- scenario: accumulation_recovery
  parameter: consumeThreadMin / 消费者实例数 / 降级策略
  suggestion: 扩容消费者（不超过 queue 数）、调大 consumeThreadMin、非核心消费临时降级（跳过/限流）
  tradeoff: 扩容增资源；降级可能丢部分非核心处理
  code_ref: ""
