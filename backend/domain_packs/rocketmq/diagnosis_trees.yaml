# 诊断决策树：典型故障的症状 → 假设 → 验证 → 调优（diagnose Agent 按树逐假设验证）。
# 内容基于 RocketMQ 4.x 公开源码与文档，待领域专家校验。
- name: message_accumulation
  symptoms: [消费滞后, 消息堆积, Rebalance 后仍堆积]
  hypothesis_checks:
    - 消费者并发不足 → 查 consumeThreadMin/consumeThreadMax 与队列数
    - 消费耗时过高 → 查 consumerStats 消费 latency、业务逻辑是否有慢 IO/锁
    - 生产速率突增 → 查 producer TPS 与 broker put TPS
    - 消费者处理阻塞 → 查 ProcessQueue 是否积压、是否有死循环/外部依赖超时
    - 消费者实例数小于队列数 → 队列无法分配（RocketMQ 队列数是消费并行度上限）
  tuning_hints:
    - 扩容消费者实例（不超过 queue 数量）
    - 调大 consumeThreadMin/consumeThreadMax
    - 业务异步化（消费只接收 + 线程池处理）
    - 临时跳过堆积（从 MAX_OFFSET 开始消费，事后补偿）

- name: message_loss
  symptoms: [producer 发送成功但消费端未收到, 重启后部分消息丢失]
  hypothesis_checks:
    - 异步刷盘丢失 → 查 broker flushDiskType（ASYNC_FLUSH 宕机丢未刷盘消息）
    - broker 宕机未同步副本 → 查 brokerRole（ASYNC_MASTER 单点）+ HA 同步状态
    - consumer offset 异常 → 查 consumer offset 与 broker maxOffset
    - tag/SQL92 过滤 → 查订阅 tag 是否过滤掉
    - 消费失败未重试耗尽 → 查 maxReconsumeTimes 后是否进 DLQ（%DLQ%consumerGroup）
  tuning_hints:
    - flushDiskType=SYNC_FLUSH + brokerRole=SYNC_MASTER（可靠优先，性能换）
    - 核实消费幂等，重置 offset 重新消费
    - 检查 DLQ 死信队列补消费

- name: message_rebalance
  symptoms: [频繁 rebalance, 消费抖动/中断, 队列频繁重分配]
  hypothesis_checks:
    - 消费者实例频繁上下线 → 查 consumer 实例心跳/存活
    - rebalance 间隔过短 → 查 rebalanceInterval（默认 20s）
    - 分配策略不合理 → 查 AllocateMessageQueueStrategy（平均/一致性 hash/机房优先）
    - 网络分区 → 查 consumer 与 broker 心跳延迟
    - broker 端 subscription group 配置变动
  tuning_hints:
    - 稳定 consumer 实例（避免频繁发布/重启）
    - 调大 rebalanceInterval
    - 选合适 AllocateMessageQueueStrategy（ALLOCATE_CONSENSUS_HASH 抗抖动）
