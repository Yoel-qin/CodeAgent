  # ---- Profile paraphrase：NL 鲁棒性 ----
  - { id: pp01, text: "昵称去掉首尾空格", relevant: ["Profile.formatName"] }
  - { id: pp02, text: "名字格式化展示", relevant: ["Profile.formatName"] }
