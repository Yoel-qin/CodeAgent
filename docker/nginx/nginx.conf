worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100m;          # 文档上传上限（PDF/Word）

    # 上游服务
    upstream backend_up   { server backend:8000; }
    upstream frontend_up  { server frontend:5173; }

    server {
        listen 80;
        server_name _;

        # 后端 API（前缀 /api/ 透传后剥离为根路径：/api/health -> /health）
        location /api/ {
            proxy_pass http://backend_up/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE 流式（问答）—— 关闭缓冲，保证逐 token 推送（精确匹配）
        location = /api/v1/chat/completions {
            proxy_pass http://backend_up/v1/chat/completions;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # WebSocket 实时事件
        location /ws/ {
            proxy_pass http://backend_up/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # MinIO 图片/表格资源代理（前端统一走 /api/resources）
        # 前端开发服务器
        location / {
            proxy_pass http://frontend_up/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # vite HMR websocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
