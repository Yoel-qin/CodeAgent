# M40 评测回归门:
# - ci:PR/push 跑确定性测试(pytest 含 eval_set_diag 结构自洽 + baseline 纯函数单测)+ ruff。
#   零 infra、零 API key、分钟级。
# - eval-manual:手动触发(workflow_dispatch)完整诊断 eval —— compose 起 infra、clone+入库
#   RocketMQ 4.9.8、diag_eval --compare 对比 baseline,退化则 fail(exit 1 → step fail)。
#   需 repo secrets:LLM_API_KEY / EMBEDDING_API_KEY(其余 PG/Redis/ES/Milvus 用 config 默认
#   值 = compose 默认凭据 coderag/coderag@localhost)。全程约 20-40 分钟,非必跑
#   (发布前/检索大改后手动跑)。
name: eval

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync --extra dev  # pytest/ruff 在 [project.optional-dependencies].dev，默认 uv sync 不装（首跑踩坑：Failed to spawn pytest）
      - name: Pytest (deterministic)
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check .

  eval-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync
      - name: Start infra (docker compose)
        working-directory: .
        run: docker compose up -d
      - name: Wait for PG + Milvus
        working-directory: .
        run: |
          timeout 300 bash -c 'until docker compose exec -T postgres pg_isready -U coderag > /dev/null 2>&1; do sleep 5; done'
          timeout 300 bash -c 'until curl -sf http://localhost:9091/healthz > /dev/null; do sleep 5; done'
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Clone RocketMQ 4.9.8
        run: git clone --depth 1 --branch release-4.9.8 https://github.com/apache/rocketmq.git /tmp/rocketmq
      - name: Ingest RocketMQ
        run: uv run python scripts/ingest_code.py --repo /tmp/rocketmq --module rocketmq
      - name: Diag eval vs baseline
        run: uv run python scripts/diag_eval.py
